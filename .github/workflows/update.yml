name: Update formula on new g8s release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bump formula to the latest g8s release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/tamld/g8s/releases/latest --jq .tag_name | sed 's/^v//')
          CURRENT=$(awk -F'"' '/^  version /{print $2; exit}' Formula/g8s.rb)
          echo "latest=${LATEST} current=${CURRENT}"
          if [ "${LATEST}" = "${CURRENT}" ]; then
            echo "Formula is up to date."
            exit 0
          fi
          BASE="https://github.com/tamld/g8s/releases/download/v${LATEST}"
          CS=$(curl -fsSL "${BASE}/checksums.txt")
          DARWIN=$(echo "${CS}" | awk -v f="g8s_${LATEST}_darwin_all.tar.gz" '$2==f{print $1}')
          LINAMD=$(echo "${CS}" | awk -v f="g8s_${LATEST}_linux_amd64.tar.gz" '$2==f{print $1}')
          LINARM=$(echo "${CS}" | awk -v f="g8s_${LATEST}_linux_arm64.tar.gz" '$2==f{print $1}')
          for v in "${DARWIN}" "${LINAMD}" "${LINARM}"; do
            [ -n "${v}" ] || { echo "ERROR: missing checksum entry in checksums.txt"; exit 1; }
          done
          sed -i "s/^  version \"[^\"]*\"/  version \"${LATEST}\"/" Formula/g8s.rb
          sed -i "s/sha256 \"[0-9a-f]*\" # darwin_all/sha256 \"${DARWIN}\" # darwin_all/" Formula/g8s.rb
          sed -i "s/sha256 \"[0-9a-f]*\" # linux amd64/sha256 \"${LINAMD}\" # linux amd64/" Formula/g8s.rb
          sed -i "s/sha256 \"[0-9a-f]*\" # linux arm64/sha256 \"${LINARM}\" # linux arm64/" Formula/g8s.rb
          git diff --stat
          git config user.name "g8s-tap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Formula/g8s.rb
          git commit -m "g8s ${LATEST} (checksums from tamld/g8s release)"
          git push
